plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2' // ИСПРАВЛЕНО: Установлена реальная стабильная версия 3.x
    id 'io.spring.dependency-management' version '1.1.6' // ИСПРАВЛЕНО: Совместимая версия менеджмента зависимостей
}

group = 'ru.vk.education'
version = '0.0.1-SNAPSHOT'
description = 'job-tracking'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    manifest {
        attributes('Main-Class': 'ru.vk.education.job.Main')
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Основные зависимости приложения
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql:42.7.2'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Тестовые зависимости
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Testcontainers для интеграционных тестов
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // Платформа для запуска тестов (без ручного указания версий)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}